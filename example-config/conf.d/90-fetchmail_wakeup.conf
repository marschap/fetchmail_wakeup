##
## fetchmail_wakeup plugin: awaken fetchmail on IMAP IDLE, NOOP & STATUS commands
##

# Do not forget to enable the fechmail_wakeup plugin in 20-imap.conf
# by adding 'fetchmail_wakeup = yes' it to the 'mail_plugins' section
# in 'protocol imap'.

# IAMP commands used as trigger to awake fetchmail
# The default is empty meaning all four (noop, status, idle and notify)
#fetchmail_wakeup_commands = noop status idle notify

# Set minimal interval between two fetchmail invocations to NUMBER seconds.
# If it is not given, the interval defaults to 60.
fetchmail_wakeup_interval = 60

# Execute COMMAND to either start fetchmail (or any other mail fetching tool),
# or to awaken a running fetchmail daemon (or any other mail fetching tool).
# The variables %{user}, ${home}, %{protocol}, and %{service} are supported.
# This setting is recommended when a system-wide deamon is used to fetch mails.
fetchmail_wakeup_helper = /usr/bin/awaken-fetchmail

# Use NAME as the file to read the PID of a running fetchmail instance from,
# and awaken this instance by sending it the SIGUSR1 signal.
# The variables %{user}, ${home}, %{protocol}, and %{service} are supported.
# This setting is recommended when per-user instances of fetchmail are used.
fetchmail_wakeup_pidfile = %{home}/.fetchmail.pid

# If fetchmail_wakeup_helper is given, it takes precedence; in this case
# fetchmail_wakeup_pidfile is ignored.
